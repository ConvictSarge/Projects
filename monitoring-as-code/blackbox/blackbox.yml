modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true   # LAN services with self-signed certificates
  http_any:            # up = answered at all (login pages, redirects, 401s)
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200, 301, 302, 401, 403, 404]
      tls_config:
        insecure_skip_verify: true
  tcp:
    prober: tcp
    timeout: 5s
